<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>Sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f9fafb;
        color: #111827;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #030712; color: #f9fafb; }
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: #6b7280; margin: 0 0 1.25rem; }
      button {
        background: #16a34a; color: #fff; border: 0; border-radius: 0.6rem;
        padding: 0.7rem 1.2rem; font-size: 1rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível carregar. Confira sua internet e tente de novo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
